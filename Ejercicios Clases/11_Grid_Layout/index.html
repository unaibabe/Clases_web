<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid - Layout</title>
    <style>
        body{
            /* background-color: black; */
            background-image: radial-gradient(circle,rgb(9, 27, 118) 0%, rgb(38, 32, 87) 20%, rgb(14, 17, 57) 42%, rgb(54, 8, 189) 100%);
            color: aliceblue;
            text-align: center;
        }
        #contenedor{
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 10px;
            height: 30rem;
        }
        #contenedor div{
            background-color: rgb(165, 138, 42);
            border: solid 1px white;
            border-radius: 5px;
            text-align: center;
            padding-top: 20%;
            font-size: 2rem;
        }
        #contenedor div:hover{
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <h3>Grid Layout - Composicion de rejilla</h3>
    <div id="contenedor">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
