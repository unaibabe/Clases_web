<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validacion</title>
    <style>
      /* Reset y Tipografía */
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      /* Contenedor del Formulario */
      form {
        max-width: 500px;
        width: 100%;
      }

      fieldset {
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        background-color: #1e1e1e;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      legend {
        padding: 0 10px;
        font-weight: bold;
        color: #bb86fc; /* Morado neón suave */
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      legend:hover {
        transition: border 1s ease;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
      }

      /* Inputs, Textarea y Botones */
      input[type="text"],
      input[type="password"],
      textarea {
        width: 100% !important;
        background-color: #2c2c2c;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 12px;
        color: white;
        margin-bottom: 15px;
        transition:
          border 0.3s,
          box-shadow 0.3s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #bb86fc;
        box-shadow: 0 0 8px rgba(187, 134, 252, 0.3);
      }

      /* Estilo específico para el botón de enviar */
      input[type="submit"] {
        background-color: #bb86fc;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
        width: auto;
      }

      input[type="submit"]:hover {
        background-color: #9965f4;
      }

      /* Ajuste para el DNI que tiene un margin inline en tu HTML */
      #dni {
        margin-left: 0 !important;
      }

      /* Placeholder */
      ::placeholder {
        color: #777;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <!-- la validacion es como lo que hicimos con la edad de min y max, son condiciones -->
    <form action="" method="post">
      <fieldset>
        <legend>Validacion Nombre</legend>
        <label for="nombre">Nombre:</label>
        <!-- vamos a hacer que sea obligatorio y que tenga minimo letras -->
        <input
          type="text"
          id="nombre"
          required
          minlength="3"
          placeholder="El nombre debe ser de 3 caracteres minimo"
        />
        <input type="submit" name="" id="nombre" /><br />

        <label for="comentario">Comentario</label>
        <textarea
          name="comentario"
          id="comentario"
          rows="4"
          cols="50"
          placeholder="Escribe aquí tu mensaje..."
        ></textarea>
      </fieldset>

      <fieldset>
        <legend>Validacion DNI</legend>
        <label for="dni">DNI:</label>
        <!-- usar regex para validaciones -->
        <!-- para poner limites es entre [] ahi dentro puedes poner numeros o letras [0-9] 0 [a-z](estas seran minusculas) -->

        <!-- como es dni vamos a hacer que solo admita 8 numero y letras mayus -->
        <!-- el title hara que si te quedas encima aparezca ese mensaje -->
        <input
          type="text"
          name=""
          id="dni"
          required
          pattern="[0-9]{8}[A-Z]{1}"
          title="8 numero y una letra mayusc"
          placeholder="Ej. 12345678A"
        />
        <label for="pass">Contraseña</label>
        <!-- 
        REQUISITOS DE VALIDACIÓN:
        (?=.\*)      -> Asegura que haya contenido (cualquier carácter).
        (?=.*[a-z]) -> Al menos una letra minúscula obligatoria.
        (?=.*[A-Z]) -> Al menos una letra mayúscula obligatoria.
        (?=.*[\W_]) -> Al menos un símbolo o carácter especial (ej: !@#_).
        .{8,12}     -> Longitud total de entre 8 y 12 caracteres.
        -->
        <input
          type="password"
          name=""
          id="pass"
          pattern="(?=.\*)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,12}"
          placeholder="Contraseña"
          title="Tiene que tener mayus minusc y caracter especial. De 8 a 12 caracteres"
        />
      </fieldset>
    </form>
  </body>
</html>
