<!doctype html>
<head>
  <title>Mario Kart Animations</title>
  <!-- <link href="style.css" rel="stylesheet" type="text/css"> -->
  <style>
    /*// BASE STYLES //*/

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
    }

    .grass,
    .sky,
    .road {
      position: relative;
    }

    .sky {
      height: 40%;
      background: skyblue;
    }

    .grass {
      height: 30%;
      background: seagreen;
    }

    .road {
      height: 30%;
      background: dimgrey;
      box-sizing: border-box;
      border-top: 10px solid grey;
      border-bottom: 10px solid grey;
      width: 100%;
    }

    .lines {
      box-sizing: border-box;
      border: 5px dashed #fff;
      height: 0px;
      width: 100%;
      position: absolute;
      top: 45%;
      /* animation: lineas 3s infinite ease-in; */
    }
    .meta {
      /* background-color: rgb(250, 250, 250); */
      position: absolute;

      left: 550px;
      top: -10px;
      width: 60px;
      height: 200px;
      background: conic-gradient(
        #000 90deg,
        #fff 90deg 180deg,
        #000 180deg 270deg,
        #fff 270deg
      );
      background-size: 40px 40px;
    }
    .flower {
      position: absolute;
      scale: 0.1;
      left: -100px;
      top: -220px;
    }
    /* .tree {
      position: absolute;
      scale: 0.5;
      left: 00px;
      top: -220px;
    } */

                /*ANIMs*/
    .mario {
      position: absolute;
      scale: 0.5;
      top: -40px;
      left: 0px;
      animation: mario 3s infinite ease-in-out;
    }
    .luigi {
      position: absolute;
      scale: 0.5;
      top: 40px;
      animation: luigi 3s infinite ease-in;
    }
    .nube {
      position: absolute;
      left: 600px;
      animation: nube 3s infinite linear;
    }
    #nube-2 {
      position: absolute;
      left: 800px;
      animation: nube-2 3s infinite linear;
    }
    .bowser {
      position: inherit;
      animation: bowser 3s infinite ease-in;
      scale: 0.5;
      top: -50px;
    }
    .goku {
      position: inherit;
      animation: goku 3s infinite ease-in;
      scale: 0.5;
      top: -400px;
    }


    @keyframes mario {
      0% {
        left: 0px;
      }
      100% {
        left: 800px;
      }
    }
    @keyframes luigi {
      0% {
        left: 0px;
      }
      100% {
        left: 600px;
      }
    }
    @keyframes nube {
      0% {
        left: 800px;
      }
      100% {
        left: -800px;
      }
    }
    @keyframes nube-2 {
      0% {
        top: -30px;
        left: 200px;
      }
      100% {
        top: -30px;
        left: 100px;
      }
    }
    @keyframes lineas {
      0% {
        left: -80px;
      }
      100% {
        left: 0px;
      }
    }
    @keyframes bowser {
      0% {
        left: -500px;
      }
      100% {
        left: 2000px;
      }
    }
    @keyframes goku {
      0% {
        left: -500px;
      }
      100% {
        left: 2000px;
      }
    }
  </style>
</head>
<body>
  <div class="sky">
    <!-- <img class="nube" src="./img/cloud.png" alt="" /> -->
    <img id="nube-2" src="./img/cloud.png" alt="" />
  </div>
  <div class="grass"></div>
  <div class="road">
    <div class="lines"></div>
    <div class="meta"></div>
    <img class="mario" src="./img/mario.png" alt="" />
    <img class="luigi" src="./img/luigi.png" alt="" />
    <img class="bowser" src="./img/bowser-walking.gif" alt="" />
    <img class="goku" src="./img/goku-flying.gif" alt="" />
    <img class="flower" src="./img/flower.gif" alt="" />
    <img src="./img/tree.gif" alt="" class="tree">
  </div>
</body>
