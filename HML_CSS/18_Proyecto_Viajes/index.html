<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #818181;
      }
      img{
        display: flex;
        scale: 0.3;
        margin: 0px;
        padding: 0px;
        /* position: absolute; */

      }
      .bowser{
        position: relative;
        left: -123px;
        animation: bowser 3s linear infinite
      }
      
      header {
        background-color: #7d6c6c;
        /* padding: 0px; */
        text-align: center;
        height: 8vh;
        font-size: 8px;
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 10%;
        z-index: -1;

      }
      @keyframes bowser {
        0%{left: -126px;}
        100%{left: 126px;}
        
      }

      .nav {
        display: flex;
        width: 100%;
      }
      /* Style the topnav */
      ul.topnav {
        width: 100%;
        height: 8vh;
        display: flex;
        list-style-type: none;
        margin: 10;
        padding: 0;
        background-color: #333333;
      }

      /* Style links in topnav */
      ul.topnav li a {
        display: block;
        color: #f1f1f1;
        padding: 14px 16px;
        text-decoration: none;
      }

      /* Change color on hover */
      ul.topnav li a:hover {
        background-color: #dddddd;
        color: black;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <header>
        <img class="bowser" src="../17_Animaciones/img/bowser-walking.gif" alt="">
        <h1>Agencia Catacrack</h1>
      </header>

      <ul class="topnav">
        <li><a href="#">Europa</a></li>
        <li><a href="#">Asia</a></li>
        <li><a href="#">America</a></li>
        <li><a href="#">Oceania</a></li>
      </ul>
    </nav>
  </body>
</html>
