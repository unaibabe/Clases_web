    <style>

      }
      
      ul {
        list-style-type: none;
        align-content: center;
        display: flex;
        justify-content: center;
        
      }
      ul li {
        float: left;
        padding: 10px;
        margin: 10px;
        width: 100px;
        height: 100px;
        text-align: center;
        align-content: center;
        border-radius: 10px;
        /* background-color: rgb(24, 31, 37); */

        border: 3px solid;
        border-color: #5158a3;
        
      }
      a{
        color: antiquewhite;
      }
      ul li:hover{

      }
      #logo{
        width: 30px;
      }

        width: 50px;
      }
      #logojs{

      }
