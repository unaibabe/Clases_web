<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <form action="" method="post">
      <fieldset>
        <legend>Selecciona idiomas que dominas</legend>
        <input type="checkbox" id="fr" name="idiomas" />
        <label for="fr">Frances</label>

        <input type="checkbox" id="en" name="idiomas" />
        <label for="en">Ingles</label>

        <input type="checkbox" id="de" name="idiomas" />

        <input type="checkbox" id="jp" name="idiomas" />

        <input type="checkbox" id="ch" name="idiomas" />

        <input type="submit" value="Enviar" />
      </fieldset>
    </form>

    <form action="" method="post">
      <fieldset>
        <legend>Comida</legend>
        <label for="">Tienes Hambre?</label><br>
        
        <input type="radio" id="si" name="hambre">
        <label for="si">Si</label>

        <input type="radio" id="no" name="hambre">
        <label for="no">No</label><br><br>

        <input type="submit" value="Mandar">

      </fieldset>
    </form>
  </body>
