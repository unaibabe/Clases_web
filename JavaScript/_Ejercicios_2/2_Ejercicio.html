<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2</title>
  </head>
  <body>
    <!-- A partir del ejercicio anterior, crea un listado con el nombre del cliente y el importe, 
     de aquellos importes inferiores a 1000. Cada uno debe aparecer en una línea diferente. -->
    <script>
      const facturas = [
        { cliente: "Ramirez", importe: 1400 },
        { cliente: "Joseba", importe: 1000 },
        { cliente: "Eustakio", importe: 500 },
        { cliente: "Albarez", importe: 400 },
        { cliente: "Gonzalez", importe: 2000 },
      ];

      //   const importesSuperiores = facturas.filter(importe => importe.importe < 1000)
      //   console.log(`${importesSuperiores.importe}`)
      for (i = 0; i < facturas.length; i++) {
        if (facturas[i].importe<1000){
            document.write(`Codigo factura: ${i+1}, cliente: ${facturas[i].cliente}, importe: ${facturas[i].importe} <br>`)
        }
      }
    </script>
  </body>
</html>
