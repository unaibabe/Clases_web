<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 3</title>
    <style>
      body {
        background-color: black;
        color: white;
        display: flex;
        position: relative;
      }
      .card {
        width: 40%;
        background-color: rgb(18, 77, 166);
        margin: 20px;
        border-radius: 10px;
        padding: 10px;
      }
      .contenedor {
        /* position: absolute; */
        background-color: rgb(40, 73, 103);
        width: 80%;
        border-radius: 10px;
        margin: auto;
        margin-top: 30vh;
        display: flex;
        height: 400px;
        padding: 50px;
      }
      .contenedor .card {
        margin: 15px auto;
        font-weight: bold;
      }
      .card p {
        display: flex;
        font-size: 20px;
        align-items: center;
        justify-content: center;
        text-align: start;
      }
      label,
      input,
      button {
        height: 30px;
        align-items: center;
        justify-content: center;
        margin: 20px 10px;
      }
      input {
        background-color: rgb(0, 23, 45);
        border-radius: 4px;
        padding-left: 10px;
        border: none;
        color: white;
      }
      button {
        background-color: rgb(20, 35, 101);
        border-radius: 10px;
        width: 100px;
        height: 35px;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: aqua;
      }
      #mensaje {
        width: 80%;
        height: 50px;
        background-color: rgb(8, 37, 111);
        border-radius: 10px;
        margin: auto;
      }
    </style>
  </head>

  <body>
    <!-- Un negocio vende tres tipos de artículos. 
     Los precios se almacenan en una estructura de array donde cada elemento 
     es el binomio artículo-precio (tanto el artículo como el precio se deben inventar). 
     Desarrolla una función que introduciendo el artículo retorne su precio. -->
    <div class="contenedor">
      <div id="articulo" class="card">
        <p>Lista de articulos:</p>
        <p id="lista"></p>
      </div>
      <div class="card">
        <label for="buscador">Articulo:</label>
        <input type="text" id="buscador" placeholder="pon un producto" />
        <button id="btn">BUSCAR</button>
        <p id="mensaje">Precio de producto elegido</p>
      </div>
    </div>

    <script>
      const listaArticulos = document.getElementById("lista");

      const objeto = document.getElementById("buscador");
      const mensaje = document.getElementById("mensaje");
      const boton = document.getElementById("btn");

      const articulos = [
        { articulo: "Arroz", precio: 2 },
        { articulo: "Garbanzos", precio: 1 },
        { articulo: "Mandarina", precio: 3 },
        { articulo: "Platano", precio: 5 },
        { articulo: "Melon", precio: 7 },
        { articulo: "Tomate", precio: 6 },
      ];

      for (art of articulos) {
        listaArticulos.innerHTML += `· ${art.articulo} <br>`;
      }
      function buscador(objeto) {
        for (elemento of articulos) {
          if (elemento.articulo.toLowerCase() === objeto) {
            mensaje.innerHTML = `El precio de ${objeto} es de ${elemento.precio} €`;
            break;
          } else {
            mensaje.innerHTML = "No tenemos ese producto";
          }
        }
      }
      boton.addEventListener("click", function () {
        const valor = objeto.value.toLowerCase();
        if (valor) {
          buscador(valor);
        } else {
          mensaje.innerHTML = "No hay nada escrito";
        }
      });
      objeto.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          buscador(objeto.value);
        }
      });

      //   buscador(objeto.value);
    </script>
  </body>
</html>
