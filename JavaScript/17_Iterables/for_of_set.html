<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set array</title>
  </head>
  <body>
    <script>
      // un set coleccion de valores unicos, no admite duplicados
      const productos_unicos = new Set([
        "Tomate",
        "Arroz",
        "Tomate",
        "Garbanzos",
      ]);
      console.log(productos_unicos);
      for(let procucto of productos_unicos){
        console.log(procucto);
        
      }
    </script>
  </body>
</html>
