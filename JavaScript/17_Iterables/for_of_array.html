<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Iterables</title>
  </head>
  <body>
    <script>
        // Numerico
      const notas = [7, 9, 4, 10];
      for(let i of notas){
        document.write(i + "<br>")
      }
    </script>
  </body>
