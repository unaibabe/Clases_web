<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Try Cach</title>
  </head>
  <body>
    <h3>Introduce la nota</h3>
    <label for="entrada">Pon una nota</label>
    <input type="number" id="entrada" placeholder="nota" />
    <button onclick="calificar()">Calificar</button>
    <p id="mensaje"></p>

    <script>
      function calificar() {
        let nota = document.getElementById("entrada").value;
        try {
          if (isNaN(nota)) throw "No es un numero";
          if (nota.trim() == "") throw "Esta vacio";
          if (nota > 10) throw "Valos demasiado alto";
          if (nota < 0) throw "Numero demasiado bajo";

          if(nota >= 0 && nota <5){
            document.getElementById("mensaje").innerHTML = "Suspendido"
          }
          else{
            document.getElementById("mensaje").innerHTML = "Aprobado"
          }
        } catch (error) {
            document.getElementById("mensaje").innerHTML = error
        }

      }
    </script>
  </body>
</html>
