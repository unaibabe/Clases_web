<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div con texto (appendchild)</title>
    <style>
      
      .contenedor {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .card {
        width: 200px;
        height: 200px;
        background-color: blue;
        margin-top: 10px;
        border-radius: 5px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card p {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <button id="agregar">Añadir capa</button>
    <button id="borrar">Eliminar Primera Capa</button>
    <input type="text" id="input" />
    <div  class= "contenedor" id="contenedor"></div>

    <script>
      const btnAgregar = document.getElementById("agregar");
      const btnEliminar = document.getElementById("borrar");
      const input = document.getElementById("input");
      const contenedor = document.getElementById("contenedor")


      function agreagar() {
        const div = document.createElement("div");
        const parrafo = document.createElement("p");

        div.className = "card";

        parrafo.innerText = input.value;

        div.appendChild(parrafo);
        contenedor.appendChild(div);
        input.value = "";
      }

      btnAgregar.addEventListener("click", agreagar);

      btnEliminar.addEventListener("click", () => {
        const divs = document.querySelectorAll("div");
        if (divs.length > 0) {
          const primerDiv = divs[0];
          primerDiv.remove();
        } else {
          alert("no hay divs");
        }
      });
    </script>
  </body>
</html>
