<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <label for="dni">Introduce DNI</label>
    <input id="numero" type="number" placeholder="pon dni ej 1,2,3.." />
    <button id="botin">Buscar</button>
    <p id="mensaje"></p>

    <script>
      const numero = document.getElementById("numero");
      const boton = document.getElementById("botin");
      const mensaje = document.getElementById("mensaje");

      const miLista = [
        { dni: 1, nombre: "Eva" },
        { dni: 2, nombre: "Maria" },
        { dni: 3, nombre: "Toni" },
      ];

      function buscar() {
        numeroDNI = numero.value;
        for (let i of miLista) {
          if (i.dni == numeroDNI) {
            mensaje.innerText = `Persona encontrada su nombre es ${i.nombre}`;
            break;
          } else {
            mensaje.innerText = "Texto no encontrado";
          }
        }
      }

      boton.addEventListener("click", () => {
        buscar();
      });
    </script>
  </body>
</html>
