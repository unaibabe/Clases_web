<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: rgb(42, 42, 42);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .capa-principal {
        position: relative;
        width: 90%;
        height: 90vh;
        background-color: grey;
        border-radius: 10px;
      }
      .imagen {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .botones {
        /* background-color: antiquewhite; */
        position: absolute;
        right: 5px;
        bottom: 50px;
        display: flex;
        flex-direction: column;
        width: 10%;
        /* margin: 0px 0px 25px 0px; */
      }
      button {
        margin-top: 25px;
        border-radius: 8px;
        height: 50px;
      }
      button:hover {
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <div class="capa-principal">
      <div id="imagen-contenedor" class="imagen">
        <img id="imagen" src="" alt="" />
      </div>
      <div id="contenedorBotones" class="botones">
        <button data-personaje="bart" id="bart">Bart</button>
        <button data-personaje="lisa" id="lisa">Lisa</button>
      </div>
    </div>
    <script>
      const imagenPersonaje = document.getElementById("imagen");
      const imagenContenedor = document.getElementById("imagen-contenedor");
      const bart = document.getElementById("bart");
      const lisa = document.getElementById("lisa");
      const contenedorBotones = document.getElementById("contenedorBotones");

      contenedorBotones.addEventListener("click", (personaje) => {
        const miPersonaje = personaje.target.dataset.personaje;
        imagenPersonaje.src = `./img/${miPersonaje}.gif`;
      });

      //     cambiarPersonaje("bart");
      //   });
      //   lisa.addEventListener("click", () => {
      //     cambiarPersonaje("lisa");
      //   });
    </script>
  </body>
</html>
