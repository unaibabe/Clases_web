<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: black;
        color: white;
      }
      nav {
        background-color: white;
        width: 100%;
        height: 100px;
      }
      section {
        display: flex;
        width: 100%;
        height: 500px;
        background-color: blue;
      }
      .aside-0 {
        width: 80%;
        background-color: rgb(89, 89, 17);
        /* height: 400px; */
      }
      .aside-1 {
        width: 12%;
        background-color: beige;
        /* height: 400px; */
      }
      .aside-2 {
        width: 8%;
        background-color: rgb(253, 253, 0);
        /* height: 400px; */
      }
      footer {
        width: 100%;
        height: 100px;
        background-color: aqua;
      }

      @media screen and (min-width: 480px) and (max-width: 768px) {
        body {
          display: block;
        }
        nav {
          display: block;
        }
        section {
          display: block;
        }
        aside {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>HTML Semantico</header>
    <nav>menjor blanc 100%</nav>
    <section>
      <aside class="aside-0"></aside>
      <aside class="aside-1"></aside>
      <aside class="aside-2"></aside>
    </section>
  </body>
  <footer>PELL</footer>
</html>
