<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Arrays</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      .contenedor {
        padding: 40px;
        display: flex;
        flex-direction: column;
        width: 350px;
        min-height: 300px;
        background-color: rgb(6, 64, 114);
        border-radius: 30px;
        align-items: center;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
        z-index: 0;
      }

      /* Borde animado */
      .contenedor::before {
        content: "";
        position: absolute;
        z-index: -2;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background-image: conic-gradient(red, yellow, green, cyan, blue, red);
        animation: rotate 4s linear infinite;
      }

      .contenedor::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 4px;
        top: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        background-color: rgb(6, 64, 114);
        border-radius: 26px;
      }

      @keyframes rotate {
        from { transform: rotate(0); }
        to { transform: rotate(360deg); }
      }

      input {
        background-color: rgb(41, 41, 41);
        border: none;
        border-radius: 10px;
        width: 90%;
        height: 35px;
        margin: 15px 0;
        color: white;
        text-align: center;
        font-weight: bold;
      }

      button {
        width: 100%;
        height: 35px;
        border-radius: 10px;
        border: none;
        margin: 5px 0;
        cursor: pointer;
        font-weight: bold;
        background: linear-gradient(90deg, #2a7b9b, #57c785, #eddd53);
        transition: transform 0.2s;
      }

      button:hover {
        transform: scale(1.05);
        filter: brightness(1.1);
      }

      #resultado {
        margin-top: 20px;
        width: 100%;
        text-align: center;
        font-size: 0.9em;
        max-height: 150px;
        overflow-y: auto;
      }

      .item-lista {
        background: rgba(255, 255, 255, 0.1);
        margin: 4px 0;
        padding: 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h3>Lista de Nombres</h3>
      <label for="input">Escribe un nombre:</label>
      <input id="input" type="text" placeholder="Ej. Juan" />
      
      <button onclick="agregar()">Añadir a la lista</button>
      <button onclick="listar()">Mostrar todos</button>
      <button onclick="eliminar()" style="background: #e74c3c; color: white;">Eliminar último</button>
      
      <div id="resultado"></div>
    </div>

    <script>
      let nombres = [];
      const inputNombre = document.getElementById("input");
      const contenedorRes = document.getElementById("resultado");

      function agregar() {
        const valor = inputNombre.value.trim();
        
        if (valor === "") {
          alert("Por favor, escribe un nombre");
          return;
        }

        nombres.push(valor);
        contenedorRes.innerHTML = `<p style="color: #57c785;">"${valor}" añadido!</p>`;
        inputNombre.value = "";
        inputNombre.focus();
      }

      function listar() {
        if (nombres.length === 0) {
          contenedorRes.innerHTML = "<p>La lista está vacía</p>";
          return;
        }

        let html = "<strong>Elementos:</strong><br>";
        nombres.forEach((nombre, index) => {
          html += `<div class="item-lista">${index + 1}. ${nombre}</div>`;
        });
        contenedorRes.innerHTML = html;
      }

      function eliminar() {
        if (nombres.length > 0) {
          const borrado = nombres.pop();
          contenedorRes.innerHTML = `<p style="color: #eddd53;">Eliminado: ${borrado}</p>`;
        } else {
          contenedorRes.innerHTML = "<p>Nada que eliminar</p>";
        }
      }

      // Permitir pulsar "Enter" para añadir
      inputNombre.addEventListener("keypress", (e) => {
        if (e.key === "Enter") agregar();
      });
    </script>
  </body>
</html>
