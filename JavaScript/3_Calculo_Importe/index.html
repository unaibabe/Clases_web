<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculo de Descuento</title>
    <link href="https://googleapis.com" rel="stylesheet" />

    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "Inter", sans-serif;
      }

      .contenedor {
        width: 90%;
        max-width: 400px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      h3 {
        margin: 0 0 10px 0;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #57c785, #eddd53);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      input {
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        font-size: 1rem;
        outline: none;
        transition: border 0.3s ease;
      }

      input:focus {
        border-color: #57c785;
      }

      /* Quitar flechas del input number para que sea más limpio */
      input::-webkit-inner-spin-button,
      input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      button {
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 12px;
        color: #0f172a;
        background: linear-gradient(
          90deg,
          #2a7b9b 0%,
          #57c785 50%,
          #eddd53 100%
        );
        background-size: 200% auto;
        transition: all 0.3s ease;
      }

      button:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 20px rgba(87, 199, 133, 0.3);
      }

      p {
        margin: 10px 0 0 0;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h3>Calculadora Pro</h3>

      <input type="number" id="importe" placeholder="Importe total (€)" step="0.1" />
      <input type="number" id="descuento" placeholder="Descuento (%)" />

      <button onclick="calcular()">Calcular precio final</button>

      
      <p>Introduce los datos para procesar</p>
      <p id="resultado"></p>
    </div>

    <script>
      function calcular() {
        let importe_total = parseFloat(document.getElementById("importe").value);
        let descuento = parseFloat(document.getElementById("descuento").value);

        let aDescontar = parseFloat(importe_total * (descuento / 100));
        let resultado = importe_total - importe_total * (descuento / 100);
        console.log(resultado);

        document.getElementById("resultado").innerHTML = "El precio final es: " + resultado.toFixed(2) + "€" +" Y el precio a descontar es: "+ aDescontar.toFixed(2) +"€";
      }
    </script>
  </body>
</html>
