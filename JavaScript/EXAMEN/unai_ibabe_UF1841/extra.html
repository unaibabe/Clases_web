<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extra Extra!</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        display: grid;
        grid-template-columns: repeat(2, 0fr);
        gap: 0px;
        margin-left: 50px;
        margin-top: 50px;
        background-color: gray;
        position: relative;
        width: 100%;
        box-sizing: border-box;
      }
      .cuadrado {
        /* display: grid; */
        width: 50px;
        height: 50px;
        /* border: dotted 5px black; */
      }
      #uno {
        background-color: aqua;

        /* transition: 1s ease-in-out; */
      }
      #uno:hover {
        /* scale: 1.5; */
        /* transform: rotate(360deg); */
        animation: rotador 1s ease-in-out;
      }
      #dos {
        background-color: blue;
        transition: 100ms ease-in-out;
      }
      #dos:hover {
        border-radius: 50%;
      }
      @keyframes rotador {
        0% {
          border-radius: 0;
        }
        50% {
          border-radius: 50%;
          background-color: aliceblue;
          transform: rotate(-360deg);
        }
        100% {
          border-radius: 0px;
        }
      }
      #tres {
        background-color: hotpink;
        clip-path: polygon(
          50% 0%,
          74% 10%,
          89% 33%,
          96% 61%,
          84% 93%,
          50% 100%,
          16% 93%,
          5% 57%,
          14% 32%,
          27% 11%
        );

        /* border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; */
      }

      #cuatro {
        background-color: rgb(10, 130, 28);
      }
    </style>
  </head>
  <body>
    <div id="uno" class="cuadrado"></div>
    <div id="dos" class="cuadrado"></div>
    <div id="tres" class="cuadrado"></div>
    <div id="cuatro" class="cuadrado"></div>
  </body>
</html>
