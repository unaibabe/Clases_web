  <body>
    <h1>Formulario de Alumnos</h1>
    <label for="">DNI:</label>
    <input id="dni" type="text" /><br />

    <label for="">Nombre:</label>
    <input id="nombre" type="text" /><br />

    <label for="">Nota 1º Evaluación(60%)</label>
    <input id="nota-1" type="number" pattern="^[0-9]+$" /><br />

    <label for="">Nota 2º Evaluación(40%)</label>
    <input id="nota-2" type="text" /><br />
    <button id="registrar">Registrar Alumno</button><br />
    <p id="mensaje"></p>
