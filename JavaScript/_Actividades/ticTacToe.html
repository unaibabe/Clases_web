<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
</head>
<style>
    body {
        background-color: rgb(22, 63, 90);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 12rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

    }

    .tablero {
        position: relative;
        background-color: rgb(52, 52, 52);
        width: 920px;
        border-radius: 10px;
        height: 920px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        box-shadow: 10px 15px 10px rgb(38, 38, 38);
    }


    .cuadrado {
        width: 300px;
        height: 300px;
        background-color: aliceblue;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
        cursor: pointer;
    }

    .cuadrado:hover {
        background-color: rgb(162, 168, 174);
    }

    .mensaje-ganador {
        position: absolute;
        width: 90%;
        height: 30%;
        background-color: rgb(38, 79, 155);
        border-radius: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        left: 50px;
        flex-direction: column;
        box-shadow: 5px 5px 8px gray;
    }

    button {
        width: 50%;
        height: 60px;
        background-color: black;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background-color: white;
        color: black;
    }
</style>

<body>
    <div id="tablero" class="tablero">
    </div>

    <script>
        const tablero = document.getElementById("tablero");

        // Estado del tablero
        const estadoTablero = {
            "1": "", "2": "", "3": "",
            "4": "", "5": "", "6": "",
            "7": "", "8": "", "9": ""
        };

        /*
        ########################################## 
        ############## CREAR TABLERO #############
        ##########################################
        */

        for (let i = 0; i < 9; i++) {
            let cuadrado = document.createElement("div")
            cuadrado.className = "cuadrado"
            cuadrado.id = `cuadrado-${i}`
            tablero.appendChild(cuadrado)
        }
        /*
        ########################################## 
        ############## CREAR PIEZAS ##############
        ##########################################
        */

        let turno = true;
        cuadrado = document.querySelectorAll(".cuadrado")
        cuadrado.forEach(element => {
            element.addEventListener("click", () => {
                if (turno) {
                    element.innerText = "X"
                    element.style.color = "red"
                    turno = !turno
                    // Saco el index con el id del cuadrado y le sumo 1
                    let index = parseInt(element.id.split("").pop()) + 1
                    // Como el argumento es string lo paso a string
                    estadoTablero[index.toString()] = element.innerText
                    comprobarSiHayGanador()
                }
                else {
                    element.innerText = "O"
                    element.style.color = "blue"
                    turno = !turno
                    // Saco el index con el id del cuadrado y le sumo 1
                    let index = parseInt(element.id.split("").pop()) + 1
                    // Como el argumento es string lo paso a string
                    estadoTablero[index.toString()] = element.innerText
                    comprobarSiHayGanador()
                }
            })
        });
        /*
        ########################################## 
        ########### FUCNIONES DE CONTROL #########
        ##########################################
        */

        function reset() {
            cuadrado.forEach(element => {
                element.innerText = ""
                let index = parseInt(element.id.split("").pop()) + 1
                estadoTablero[index.toString()] = ""
                turno = true
            }
            )
        }

        function comprobarSiHayGanador() {
            if ((estadoTablero[1] === "X" && estadoTablero[2] === "X" && estadoTablero[3] === "X") ||
                (estadoTablero[4] === "X" && estadoTablero[5] === "X" && estadoTablero[6] === "X") ||
                (estadoTablero[7] === "X" && estadoTablero[8] === "X" && estadoTablero[9] === "X") ||
                (estadoTablero[4] === "X" && estadoTablero[5] === "X" && estadoTablero[6] === "X") ||
                (estadoTablero[1] === "X" && estadoTablero[5] === "X" && estadoTablero[9] === "X") ||
                (estadoTablero[3] === "X" && estadoTablero[5] === "X" && estadoTablero[7] === "X") ||
                (estadoTablero[1] === "X" && estadoTablero[4] === "X" && estadoTablero[7] === "X") ||
                (estadoTablero[2] === "X" && estadoTablero[5] === "X" && estadoTablero[8] === "X") ||
                (estadoTablero[3] === "X" && estadoTablero[6] === "X" && estadoTablero[9] === "X")) {
                console.log("EQUIS GANA");
                mensajeGanador("X")
                // reset()
            }
            else if ((estadoTablero[1] === "O" && estadoTablero[2] === "O" && estadoTablero[3] === "O") ||
                (estadoTablero[4] === "O" && estadoTablero[5] === "O" && estadoTablero[6] === "O") ||
                (estadoTablero[7] === "O" && estadoTablero[8] === "O" && estadoTablero[9] === "O") ||
                (estadoTablero[4] === "O" && estadoTablero[5] === "O" && estadoTablero[6] === "O") ||
                (estadoTablero[1] === "O" && estadoTablero[5] === "O" && estadoTablero[9] === "O") ||
                (estadoTablero[3] === "O" && estadoTablero[5] === "O" && estadoTablero[7] === "O") ||
                (estadoTablero[1] === "O" && estadoTablero[4] === "O" && estadoTablero[7] === "O") ||
                (estadoTablero[2] === "O" && estadoTablero[5] === "O" && estadoTablero[8] === "O") ||
                (estadoTablero[3] === "O" && estadoTablero[6] === "O" && estadoTablero[9] === "O")) {
                console.log("Os GANAN");
                mensajeGanador("O")
                // reset()
            } {

            }
        }
        function mensajeGanador(ganador) {
            const mensaje = document.createElement("div")
            const parrafo = document.createElement("p")
            const resetButton = document.createElement("button")

            resetButton.innerText = "RESET"

            parrafo.innerText = `${ganador} Ganan`
            mensaje.className = "mensaje-ganador"
            mensaje.appendChild(parrafo)
            mensaje.appendChild(resetButton)
            tablero.appendChild(mensaje)

            if (ganador == "X") {
                mensaje.style.backgroundColor = "rgb(148, 56, 56)"
            }

            resetButton.addEventListener("click", () => {
                mensaje.style.display = "none"
                reset()
            })

        }


    </script>
</body>

</html>
