<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrousel</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="carrousel">
      <img id="imagen-principal" src="./img/city.jpg" alt="" />
      <p id="numero">1/4</p>
      <p id="descripcion">Ciudad</p>
      <img
        class="arrow"
        id="flecha-adelante"
        src="./img/flecha-correcta.png"
        alt=""
      />
      <img
        class="arrow"
        id="flecha-atras"
        src="./img/flecha-izquierda.png"
        alt=""
      />
    </div>
  </body>
</html>
