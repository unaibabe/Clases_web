<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funciones asincronas Fetch</title>
  </head>
  <body>
    <h1>Usuarios</h1>
    <input type="text" name="" id="input" />
    <button id="buscar-usuarios">Buscar</button>
    <ul id="lista"></ul>
    <div class="filtrados"></div>

    <script>
      let usuarios = [];
      const input = document.getElementById("input");
      const boton = document.getElementById("buscar-usuarios");
      const listaUsuarios = document.getElementById("lista");
      const filtrados = document.getElementById("filtrados");

      fetch("usuarios.json")
        .then((respuesta) => {
          if (!respuesta.ok) {
            console.log("Errooooor");
          }
          return respuesta.json();
        })
        .then((datos) => {
          usuarios = datos;
          mostrarDatos(usuarios);
        })
        .catch((error) => {
          console.log("Error");
        });

      function mostrarDatos(usuarios) {
        usuarios.forEach((element) => {
          let li = document.createElement("li");
          console.log(`Dentro del for y mi elemnteo ${element.nombre}`);
          let nombre = element.nombre;
          let apellido = element.apellido;
          li.innerText = `${nombre} ${apellido}`;
          listaUsuarios.appendChild(li);
        });
      }
      input.addEventListener("input", (u) => {});
    </script>
  </body>
</html>
