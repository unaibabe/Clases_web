<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
  </head>
  <body>
    <script>
      const productos = [
        { nombre: "Teclado Mecánico", precio: 80, stock: true },
        { nombre: "Ratón Gamer", precio: 30, stock: false },
        { nombre: "Monitor 4K", precio: 300, stock: true },
        { nombre: "Alfombrilla", precio: 15, stock: true },
        { nombre: "Auriculares", precio: 50, stock: false },
      ];

      //   const ofertas = productos.filter((n) => n.precio > 60);
      //   ofertas.forEach((e) => {
      //     console.log(`${e.nombre} -> ${e.precio}€`);
      //   });
      const disponibles = productos.filter((d) => d.stock == true);
      disponibles.forEach((e) => {
        console.log(`${e.nombre} ${e.precio}€`);
      });
    </script>
  </body>
</html>
