<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. Definimos la función con la palabra 'async' para indicar que habrá esperas
        async function obtenerDatos() {
            console.log("1. Iniciando la petición...");

            // 2. 'await' hace que JS espere a que el servidor responda antes de seguir
            const respuesta = await fetch('https://jsonplaceholder.typicode.com/todos/195');

            // 3. 'await' espera a que el texto se transforme en un objeto JSON usable
            const datos = await respuesta.json();

            // 4. Mostramos el resultado final por consola
            console.log("2. Datos recibidos con éxito:");
            console.log(datos);
            
            // Acceso a un dato específico
            console.log("3. Título de la tarea:", datos.title);
        }

        // Llamamos a la función
        obtenerDatos();
    </script>
    
</body>
</html>
