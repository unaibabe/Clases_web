<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse over</title>
    <style>
      body {
        background-color: rgb(0, 9, 53);
        color: white;
        position: relative;
      }
      #capita {
        width: 200px;
        height: 100px;
        background-color: rgb(2, 56, 143);
        border-radius: 10px;
        position: absolute;
        left: 40%;
        top: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 5px 5px 1px rgb(27, 30, 34);
      }
    </style>
  </head>
  <body>
    <div id="capita">Mueve el puntero dentro de la cajita</div>

    <script>
      const capita = document.getElementById("capita");

      capita.addEventListener("mouseover", function () {
        capita.style.backgroundColor = "red";
        capita.innerHTML = "HOLA";
        capita.style.boxShadow = "1px 1px 1px  rgb(27, 30, 34)"
      });

      capita.addEventListener("mouseout", () => {
        capita.style.backgroundColor = "blue";
        capita.innerHTML = "Adios";
        capita.style.boxShadow = "5px 5px 2px rgb(27, 30, 34)"
      });
    </script>
  </body>
</html>
