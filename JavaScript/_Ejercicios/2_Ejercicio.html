<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2</title>
    <link href="https://googleapis.com" rel="stylesheet" />

    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "Inter", sans-serif;
      }

      .contenedor {
        width: 90%;
        max-width: 400px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      h3 {
        margin: 0 0 10px 0;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #57c785, #eddd53);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      input,
      select {
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        font-size: 1rem;
        outline: none;
        transition: border 0.3s ease;
      }





      button {
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 12px;
        color: #0f172a;
        background: linear-gradient(
          90deg,
          #2a7b9b 0%,
          #57c785 50%,
          #eddd53 100%
        );
        background-size: 200% auto;
        transition: all 0.3s ease;
      }

      button:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 20px rgba(87, 199, 133, 0.3);
      }

      p {
        margin: 10px 0 0 0;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h3>Ejercicio 2</h3>

      <input type="text" id="nombre" placeholder="Nombre empleado" />
      <input type="text" id="sueldo" placeholder="Sueldo" />

      <select name="opciones" id="turno">
        <option value="mañana">Mañana</option>
        <option value="tarde">Tarde</option>
        <option value="noche">Noche</option>
      </select>
      <select name="opciones" id="categoria">
        <option value="categoria 1">categoría 1</option>
        <option value="categoria 2">categoría 2</option>
        <option value="categoria 3">categoría 3</option>
      </select>

      <button onclick="calcular()">Calcular</button>
      <p></p>
      <p id="resultado"></p>
    </div>

    <script>
      function calcular() {
        let nombre = document.getElementById("nombre").value;
        let turno = document.getElementById("turno").value;
        let categoria = document.getElementById("categoria").value;
        let sueldo = parseInt( document.getElementById("sueldo").value);

        // console.log(nombre);
        // console.log(turno);
        console.log(categoria);
        console.log(sueldo);
        

        if (
          (turno == "mañana") |
          (categoria == "categoria 1" && sueldo >= 1500)
        ) {
          document.getElementById("resultado").innerHTML = nombre + " Entras"
        } else {
          document.getElementById("resultado").innerHTML = nombre + " No Entras"
        }
      }
    </script>
  </body>
</html>
