<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prevent default formulario</title>
  </head>
  <body>
    <form id="formulario" action="">
      <label for="test">Test</label>
      <input type="text" placeholder="pon algo" />
      <button id="boton" type="submit">Enviar</button>
    </form>

    <script>
      const formulario = document.getElementById("formulario");

      formulario.addEventListener("submit", (e) => {
        e.preventDefault(); // Frenamos el envío automático del navegador

        const respuesta = confirm("¿Estás seguro de enviar?");

        if (respuesta) {
          alert("¡Enviando datos!");
          e.target.submit(); // Usamos la "e" para decirle al formulario que ahora sí se envíe
        } else {
          alert("Envío cancelado");
        }
      });
    </script>
  </body>
</html>
