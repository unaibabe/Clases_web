<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A vueltas con el switch</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        flex-direction: column;
        padding: 50px;
        display: flex;
        width: 400px;
        min-height: 200px;
        border: 2px solid;
        border-color: conic-gradient(#00ccff, #d400d4, #00ccff);
        background-color: rgb(6, 64, 114);
        border-radius: 10px 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(100, 136, 255);
        transition: 150ms ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <p id="mensaje"></p>
    </div>
    <script>
      let pais = prompt("Escriba un pais de europa o america");
    //   let mensaje = document.getElementById("mensaje").innerHTML
      let continente = "";

      pais = pais.toLocaleLowerCase();
      switch (pais) {
        case "colombia":
        case "venezuela":
        case "bolivia":
          continente = "America";
          break;
        
        case "italia":
        case "grecia":
        case "euskadi":
            continente = "Europa";
            break
        default:
            continente="No corresponde a nada"    
      }
    //   document.write(continente);
    document.getElementById("mensaje").innerHTML = continente
    </script>
  </body>
</html>
