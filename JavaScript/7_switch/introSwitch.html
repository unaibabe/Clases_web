<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional switch</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        flex-direction: column;
        padding: 50px;
        display: flex;
        width: 400px;
        min-height: 200px;
        border: 2px solid;
        border-color: conic-gradient(#00ccff, #d400d4, #00ccff);
        background-color: rgb(6, 64, 114);
        border-radius: 10px 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(100, 136, 255);
        transition: 150ms ease-in-out;
      }
    </style>
</head>
<body>
    <div class="contenedor">
        <p id="mensaje"></p>
    </div>
    <script>
        let grado = prompt("escribe las soglas del grado", "Debe ser GM o GS");
        let texto = document.getElementById("mensaje").innerHTML;

        grado = grado.toUpperCase();
        switch (grado){
            case "GM":
                texto = "Grado Medio"
                break;
            
            case "GS":
                texto = "Grado Superior"
                break;
            default:
                texto = "No es un grado registrado"
                break
        }
        document.write(texto)

    </script>
</body>
</html>
