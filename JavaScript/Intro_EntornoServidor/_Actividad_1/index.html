<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante Carlos</title>
    <style>
      body {
        font-family: sans-serif;
        font-weight: bold;
        background-color: #9b9a9a;
      }
      h2 {
        text-align: center;
        border-bottom: 1px solid black;
      }

      /* El formulario ahora es el contenedor Grid principal */
      form {
        display: grid;
        /* Crea 4 columnas iguales */
        grid-template-columns: repeat(4, 1fr);
        /* Añade espacio de 20px entre las tarjetas */
        gap: 20px;
        width: 90%;
        margin: auto;
        background-color: rgb(31, 42, 60);
        border-radius: 10px;
        padding: 25px;
        box-shadow: 1px 5px 10px rgba(56, 56, 56, 0.717);
        color: white;
      }

      /* Estilos para cada tarjeta contenedora de campos */
      .card-control {
        display: flex;
        flex-direction: column;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      label {
        margin-bottom: 8px;
        font-size: 14px;
      }

      input,
      select {
        height: 35px;
        border-radius: 6px;
        border: none;
        width: 100%; /* Ocupa el 100% de su propia tarjeta */
        padding-left: 10px;
        box-sizing: border-box; /* Evita que el padding deforme el tamaño */
      }

      input:focus,
      select:focus {
        outline: none;
        border: 2px solid rgb(42, 91, 165);
      }

      /* Tarjeta especial para el checkbox de la newsletter */
      .card-control.newsletter {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      #newsletter {
        width: auto;
        height: 20px;
        cursor: pointer;
      }

      /* Hacemos que el botón de enviar ocupe las 4 columnas abajo del todo */
      .card-submit {
        grid-column: span 4;
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      input[type="submit"] {
        width: 50%;
        background-color: brown;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      input[type="submit"]:hover {
        background-color: antiquewhite;
        color: black;
      }
    </style>
  </head>
  <body>
    <h2>Reserva tu mesa</h2>

    <form action="./guardar_valores.php" method="post">
      <!-- Tarjeta 1 -->
      <div class="card-control">
        <label for="nombre">Nombre:*</label>
        <input type="text" name="nombre" id="nombre" required />
      </div>

      <!-- Tarjeta 2 -->
      <div class="card-control">
        <label for="apellido">Apellido:*</label>
        <input type="text" name="apellido" id="apellido" required />
      </div>

      <!-- Tarjeta 3 -->
      <div class="card-control">
        <label for="email">Email:*</label>
        <input type="email" name="email" id="email" required />
      </div>

      <!-- Tarjeta 4 -->
      <div class="card-control">
        <label for="telefono">Teléfono:*</label>
        <input type="text" name="telefono" id="telefono" required />
      </div>

      <!-- Tarjeta 5 -->
      <div class="card-control">
        <label for="fecha">Fecha De La Reserva:*</label>
        <input type="date" name="fecha" id="fecha" required />
      </div>

      <!-- Tarjeta 6 -->
      <div class="card-control">
        <label for="numero-personas">Número Personas:*</label>
        <input
          type="number"
          name="numero-personas"
          id="numero-personas"
          required
        />
      </div>

      <!-- Tarjeta 7 (CORREGIDO: Se añade el atributo name="turno") -->
      <div class="card-control">
        <label for="turno">Turno Reserva</label>
        <select name="turno" id="turno">
          <option value="comida">Comida</option>
          <option value="cena">Cena</option>
        </select>
      </div>

      <!-- Tarjeta 8 (CORREGIDO: Se añade value="1") -->
      <div class="card-control newsletter">
        <label for="newsletter">Newsletter</label>
        <input type="checkbox" name="newsletter" id="newsletter" value="1" />
      </div>

      <!-- Contenedor del Botón final -->
      <div class="card-submit">
        <input type="submit" name="enviar" id="enviar" value="Enviar Reserva" />
      </div>
    </form>
  </body>
</html>
