<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        flex-direction: column;
        padding: 50px;
        display: flex;
        width: 400px;
        min-height: 200px;
        border: 2px solid;
        /* border-color: conic-gradient(#00ccff, #d400d4, #00ccff); */
        background-color: rgb(6, 64, 114);
        border-radius: 10px 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(100, 136, 255);
        transition: 150ms ease-in-out;
      }
      input {
        background-color: rgb(41, 41, 41);
        border: none;
        border-radius: 10px;
        width: 90%;
        height: 25px;
        padding: 5px;
        margin: 15px;
        color: white;
        padding-left: 20px;
      }
      button {
        width: 80%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border-style: none;
        margin: auto;
        background: linear-gradient(
          90deg,
          #2a7b9b 0%,
          #57c785 50%,
          #eddd53 100%
        );
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 20px rgba(87, 199, 133, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <input id="numero" type="text" placeholder="Pon un numero para hacer el random" />
      <button onclick="mostrar()">Mostrar</button>
      <p id="mensaje"></p>
    </div>
    <script>
      //   let dia = prompt("Escriba un dia de la semana");
      //   let mensaje = document.getElementById("mensaje").innerHTML
      function mostrar() {
        let numero = document.getElementById("numero").value
        const dado = Math.floor(Math.random()*numero)
        document.getElementById("mensaje").innerHTML = `El resultado del random es: ${dado}`
      }
    </script>
  </body>
</html>
