<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout - Corregido</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box; 
      }
      
      body {
        background-color: black;
        color: aliceblue;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        gap: 8px;
        padding: 10px; 
      }

      header {
        background-color: rgb(9, 9, 81);
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .contenedor {
        display: flex;
        flex: 1;
        gap: 8px;
      }

      aside {
        background-color: rgb(4, 35, 108);
        flex: 1; 
        padding: 10px;
        font-size: small;
        text-align: center;
      }

      main {
        flex: 4;
        background-color: rgb(124, 154, 180);
        color: black;
        text-align: center;
        padding: 20px;
      }

      footer {
        background-color: grey;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
        font-size: small;
      }

      @media (max-width: 640px) {
        .contenedor {
          flex-direction: column;
        }
        
        aside, main {
          flex: none; 
          width: 100%;
          height: 50vh;
        }

        aside {
            height: 50px; 
        }
      }
    </style>
  </head>
  <body>
    <header id="header">Cabecera (Header)</header>
    <div class="contenedor">
      <aside id="aside">
        <section>Menu lateral (Sidebar)</section>
      </aside>
      <main id="main">
        <h1>Contenedor Principal</h1>
        <p>Aqui va la informacion de la web.</p>
      </main>
    </div>
    <footer id="footer">Pie de Pagina (footer)</footer>
  </body>
</html>
