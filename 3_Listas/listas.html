<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabajando con listas HTML</title>
    <style>
      :root {
        background-color: black;
        color: aliceblue;
      }
      body {
        padding: 0px;
        margin: 0px;
      }
      ul {
        list-style-type: square;
      }
      ol{
        list-style-type: lower-latin;
      }
      ul li {
        background-color: rgb(39, 87, 87);
      }
      ol li{
        background-color: rgb(76, 28, 122);
      }
    </style>
  </head>
  <body>
    <h3>Lista Ordenada</h3>
    <ol>
      <li>Seleccionar</li>
      <li>Copiar</li>
      <li>Elegir destino</li>
      <li>Pegar</li>
    </ol>
    <!-- horizontal row -->
    <hr />
    <h3>Lista desordenada</h3>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>PHP</li>
    </ul>
  </body>
</html>
