<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animaciones</title>
    <style>
      .contenedor {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      body {
        background-color: black;
        color: aliceblue;
        /* display: flex;
        align-items: center;
        justify-content: center; */
      }
      #capita {
        position: relative;
        background: #2f42a1;
        width: 150px;
        background-color: rgb(41, 41, 115);
        height: 150px;
        border: solid 1px black;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* transition: rotation 0.3s; */
        animation: myRotation 2s linear infinite;
        /* left: -400px; */
      }
      #capita:hover {
        box-shadow: 5px 5px 20px 5px rgb(74, 105, 186);
        /* background-color: aqua; */
      }
      @keyframes myRotation {
        0% {
          transform: rotate(0deg);
          left: -400px;
          border-radius: 5px;
        }
        50%{
            border-radius: 60%;
        }
        100% {
          transform: rotate(360deg);
          left: 400px;
          border-radius: 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div id="capita">BOTON</div>
    </div>
  </body>
</html>
