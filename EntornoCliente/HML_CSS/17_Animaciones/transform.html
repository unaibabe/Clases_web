<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaciones</title>
    <style>
        body{
            background-color: black;
            color: aliceblue;
        }
        #capita{
            width: 200px;
            background-color: rgb(41, 41, 115);
            height: 100px;
            border: solid 1px black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s ease-in-out;

        }
        #capita:hover{
            transform: translate(50px, 50px);
            /* transform: scale(1.1); */
        }
    </style>
</head>
<body>
    <div id="capita">o</div>
</body>
</html>
