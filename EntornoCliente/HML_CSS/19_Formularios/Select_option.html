<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="post">
      <fieldset>
        <legend>Provincias</legend>
        <label for="provincias">Selecciona una provincia</label>
        <!-- Al hacer select es un deplegable y dentro se ponen las opciones  -->
        <select name="provincia" id="provincias">
            <!-- Con la opcion disabled selected no se puede seleccionar y se hace como una cabecera -->
            <option value="" disabled selected>-- seleccione una opcion --</option>
          <option value="barcelona">Barcelona</option>
          <option value="Girona">Girona</option>
          <option value="Tarragona">Tarragona</option>
          <option value="lleida">Lleida</option></select
        ><br />
        <input type="submit" value="Enviar provincia" />
      </fieldset>
    </form>
  </body>
</html>
