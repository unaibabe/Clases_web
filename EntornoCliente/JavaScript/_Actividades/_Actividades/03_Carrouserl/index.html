<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrousel</title>
    <style>
      body {
        background-color: rgb(0, 5, 45);
        color: #fff;
      }
      .carrousel {
        margin: 100px auto;
        position: relative;
        width: 80%;
        height: 400px;
        background-color: black;
      }
      #imagen-principal {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        object-fit: cover;
        box-shadow: 10px 5px 18px #000;
        overflow: hidden;
      }
      .arrow {
        position: absolute;
        top: 50%;
        z-index: 2;
        cursor: pointer;
        width: 50px;
      }
      #flecha-atras {
        left: 0;
      }
      #flecha-adelante {
        right: 0;
      }
      #numero {
        position: absolute;
        top: 0;
        left: 2%;
        z-index: 2;
        font-size: 20px;
      }
      #descripcion {
        position: absolute;
        bottom: 0;
        left: 35%;
        z-index: 2;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        background-color: black;
        width: 30%;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="carrousel">
      <img id="imagen-principal" src="./img/city.jpg" alt="" />
      <p id="numero">1/4</p>
      <p id="descripcion">Ciudad</p>
      <img
        class="arrow"
        id="flecha-adelante"
        src="./img/flecha-correcta.png"
        alt=""
      />
      <img
        class="arrow"
        id="flecha-atras"
        src="./img/flecha-izquierda.png"
        alt=""
      />
    </div>

    <script>
      const botonAtras = document.getElementById("flecha-atras");
      const botonAdelante = document.getElementById("flecha-adelante");
      const imagenPrincipal = document.getElementById("imagen-principal");
      const numero = document.getElementById("numero");
      const descripcion = document.getElementById("descripcion");

      const imagenes = [
        { src: "./img/city.jpg", alt: "Ciudad", descripcion: "Ciudad" },
        { src: "./img/desierto.jpg", alt: "Bosque", descripcion: "Bosque" },
        { src: "./img/lago.jpg", alt: "Playa", descripcion: "Playa" },
        { src: "./img/landscape.jpg", alt: "Montaña", descripcion: "Montaña" },
      ];

      let contador = 0;

      function cambiarImagen(direccion) {
        if (direccion == "adelante") {
          contador++;
          // imagenPrincipal.style.transform = `transform: translateX(1s,5000px)`;
          if (contador >= imagenes.length) {
            contador = 0;
          }
        } else if (direccion == "atras") {
          contador--;
          if (contador <= 0) {
            contador = imagenes.length - 1;
          }
        }
        console.log(`${contador} + 1`);
        numero.innerText = `${contador + 1}/${imagenes.length}`;
        descripcion.innerText = `${imagenes[contador].descripcion}`;
        imagenPrincipal.src = `${imagenes[contador].src}`;

        // Audio al cambiar
        const audio = new Audio("./sfx/fahhh.mp3");
        audio.play();
        audio.currentTime = 0;
      }
      //   if (contador >= imagenes.length) {
      //     // console.log("ESTOY REINICIANDO");
      //     contador = 0;
      //     numero.innerText = `${contador + 1}/${imagenes.length}`;
      //     descripcion.innerText = `${imagenes[contador].descripcion}`;
      //     imagenPrincipal.src = `${imagenes[contador].src}`;
      //   } else {
      //     // console.log(`ESTOY SUMANDO ${contador}`);
      //     numero.innerText = `${contador + 1}/${imagenes.length}`;
      //     descripcion.innerText = `${imagenes[contador].descripcion}`;
      //     imagenPrincipal.src = `${imagenes[contador].src}`;
      //   }
      // }

      botonAtras.addEventListener("click", () => {
        cambiarImagen("atras");
      });
      botonAdelante.addEventListener("click", () => {
        cambiarImagen("adelante");
      });
    </script>
  </body>
</html>
