<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="btn">BOTON</button>
    <!-- <audio src="./sfx/guitar-sting-1.mp3"></audio> -->
    <script>
      const boton = document.getElementById("btn");
      const audio = new Audio("./sfx/guitar-sting-1.mp3");

      boton.addEventListener("click", () => {
        audio.play();
        audio.currentTime = 0;
      });
    </script>
  </body>
</html>
