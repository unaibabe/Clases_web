<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IF - si condicional</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        display: flex;
        width: 400px;
        height: 200px;
        border: 2px solid;
        border-color: conic-gradient(#00ccff, #d400d4, #00ccff);
        background-color: rgb(6, 64, 114);
        border-radius: 10px 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(100, 136, 255);
        transition: 150ms ease-in-out;
      }
      .contenedor p {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .contenedor:hover {
        transform: scale(1.05);
      }
      .contenedor::before {
        content: "";
        border: 2px white;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="contenedor-texto">
        <h3>IF - si condicional</h3>
        <p id="mensaje"></p>
      </div>
    </div>

    <script>
      let nota = prompt("pon una nota entre 0 y 10");
      nota = parseFloat(nota);
      if (nota < 0) {
        document.getElementById("mensaje").innerHTML = "Nota no valida";
      } else if (nota < 5) {
        document.getElementById("mensaje").innerHTML = "Suspendido";
        document.getElementById("mensaje").style.color = "red"

      } else if (nota < 7) {
        document.getElementById("mensaje").innerHTML = "Aprobado";
      } else if (nota < 9) {
        document.getElementById("mensaje").innerHTML = "Notable";
      } else if (nota <= 10) {
        document.getElementById("mensaje").innerHTML = "Sobresaliente";
      } else {
        document.getElementById("mensaje").innerHTML = "Nota noo valida";
      }
    </script>
  </body>
</html>
