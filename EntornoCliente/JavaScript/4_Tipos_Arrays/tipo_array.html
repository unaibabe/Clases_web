<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos Object - ARRAY</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;    
        height: 100vh;
      }
      .contenedor {
        display: flex;
        width: 400px;
        height: 200px;
        background-color: rgb(6, 64, 114);
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(100, 136, 255);
        transition: 150ms ease-in-out;
      }
      .contenedor:hover{
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="contenedor-texto">
        <h3>Tipos de variables Object - ARRAY</h3>
        <p id="mensaje"></p>
      </div>
    </div>

    <script>
      const semanaLaboral = [
        "Lunes",
        "Martes",
        "Miercoles",
        "Jueves",
        "Viernes",
      ];

      document.getElementById("mensaje").innerHTML =
        typeof semanaLaboral + " y el valor segundo es: " + semanaLaboral[1];
    </script>
  </body>
</html>
