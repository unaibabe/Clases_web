<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividad 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="formulario">
      <img src="./img/logo.png" alt="logo" />
      <form action="" method="post">
        <legend>Sol licitud d'informació</legend>
        <!-- Nombre -->
        <label for="nombre">Nom</label>
        <input
          type="text"
          id="nombre"
          name="f-nombre"
          placeholder="Nombre"
          required
        />
        <!-- mail  -->
        <label for="mail">Correu</label>
        <input
          type="email"
          id="mail"
          required
          name="f-mail"
          placeholder="mail@ejemplo.com"
        />
        <!-- telefono  -->
        <label for="tel">Telèfon</label>
        <input
          type="number"
          id="tel"
          required
          name="f-tel"
          placeholder="555444333"
        />
        <!-- mensaje  -->
        <label for="mensaje">Missatge</label>
        <input
          type="text"
          id="mensaje"
          placeholder="Escribe lo que necesites"
        />

        <input type="submit" value="Enviar sol licitud" />
      </form>
    </div>
  </body>
</html>
