<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Move</title>
    <style>
      body {
        background-color: rgb(0, 9, 53);
        color: white;
        position: relative;
      }
      #capita {
        width: 300px;
        height: 100px;
        background-color: rgb(2, 56, 143);
        border-radius: 10px;
        position: absolute;
        left: 40%;
        top: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 5px 5px 1px rgb(27, 30, 34);
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="capita">
      <p>Coordenadas del raton:</p>
      <p id="coordenadas"></p>
    </div>

    <script>
      const coordenadas = document.getElementById("coordenadas");
      const capita = document.getElementById("capita");

      document.addEventListener("mousemove", (e) => {
        coordenadas.innerHTML = `X: ${e.clientX} <br>
        Y: ${e.clientY} `;
        if (e.clientY > 200) {
          capita.style.backgroundColor = "red";
        }else{
            capita.style.backgroundColor = ""
        }
      });
    </script>
  </body>
</html>
