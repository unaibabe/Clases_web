<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de reflejos</title>
    <style>
      body {
        background-color: rgb(0, 9, 53);
        color: white;
        position: relative;
      }
      #capita {
        width: 300px;
        height: 100px;
        background-color: rgb(2, 56, 143);
        border-radius: 10px;
        position: absolute;
        left: 40%;
        top: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 5px 5px 1px rgb(27, 30, 34);
        flex-direction: column;
        font-size: 40px;
        cursor: pointer;
        transition: 0.3s ease-in-out;
      }
      #capita #resultado {
        display: none;
      }
      #capita:hover {
        scale: 1.1;
      }
    </style>
  </head>
  <body>
    <div id="capita">
      <p>START</p>
      <p id="resultado"></p>
    </div>

    <script>
      const capita = document.getElementById("capita");

      let click = 0;

      capita.addEventListener("click", (e) => {
        click++;
        if (click == 1) {
          capita.style.backgroundColor = "red";
          capita.innerHTML = "Preparado?";

          console.log(click);
          let tiempo_inicio = new Date.now();
        } else if (click == 2) {
          capita.style.backgroundColor = "blue";
          click = 0;
        }
      });
    </script>
  </body>
</html>
