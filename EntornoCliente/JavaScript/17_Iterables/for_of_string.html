<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const frase = "Átalá"; // Ejemplo con acentos y mayúsculas
      let contador = 0;

      // Preparamos la frase para comparar correctamente
      const fraseLimpia = frase
        .toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      // Comprobación de palíndromo
      let palindromo = fraseLimpia.split("").reverse().join("");

      if (fraseLimpia === palindromo) {
        console.log(`"${frase}" es palíndromo`);
      } else {
        console.log(`"${frase}" NO es palíndromo`);
      }

      // Conteo de aes
      for (let letra of fraseLimpia) {
        if (letra === "a") {
          contador++;
        }
      }
      console.log(`Hay ${contador} aes`);
    </script>
  </body>
</html>
