<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImagnesPokemon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: black;
        color: white;
      }
      .card {
        background-color: rgb(0, 81, 255);
        width: 90%;
        margin: 10px auto;
        display: grid;
        grid-template-columns: repeat(5, 2fr);
      }

      .tarjeta {
        background-color: rgb(14, 53, 135);
        margin: 10px;
        border-radius: 10px;
      }
      .tarjeta:hover {
        background-color: rgba(35, 14, 112, 0.877);
      }
      .tarjeta p {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
      }
      .tarjeta img {
        margin-left: 30%;
      }
    </style>
  </head>
  <body>
    <div id="card" class="card"></div>

    <script>
      const cardPrincipal = document.getElementById("card");
      const contenedorPokemons = document.getElementById("contenedor-pokemons");

      async function pokemons() {
        for (i = 1; i < 151; i++) {
          const respuesta = await fetch(
            `https://pokeapi.co/api/v2/pokemon/${i}`,
          );
          const datos = await respuesta.json();
          const urlImagen = datos.sprites.front_default;
          const nombre = datos.name;
          const uperNombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
          //   console.log(urlImagen);
          const tarjeta = document.createElement("div");
          const img = document.createElement("img");
          const p = document.createElement("p");

          tarjeta.className = "tarjeta";

          p.innerText = uperNombre;

          img.src = urlImagen;
          tarjeta.appendChild(img);
          tarjeta.appendChild(p);
          cardPrincipal.appendChild(tarjeta);
        }
      }
      pokemons();
    </script>
  </body>
</html>
