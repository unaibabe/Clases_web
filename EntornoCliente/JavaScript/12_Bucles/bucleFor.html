<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucles</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        padding: 50px;
        display: flex;
        flex-direction: column;
        width: 400px;
        min-height: 200px;
        background-color: rgb(6, 64, 114); /* Color de fondo interno */
        border-radius: 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(65, 70, 84);
        position: relative;
        overflow: hidden; /* Corta el degradado sobrante */
        z-index: 0;
      }

      /* El borde animado */
      .contenedor::before {
        content: "";
        position: absolute;
        z-index: -2; /* Va detrás de todo */
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background-image: conic-gradient(
          red,
          yellow,
          green,
          red
        ); /* Añadimos rojo al final para un loop suave */
        animation: rotate 4s linear infinite;
      }

      /* La máscara para crear el efecto de "borde" */
      .contenedor::after {
        content: "";
        position: absolute;
        z-index: -1; /* Encima del degradado, pero debajo del texto */
        left: 4px; /* Grosor del borde */
        top: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        background-color: rgb(6, 64, 114); /* Mismo color que el fondo */
        border-radius: 26px; /* Un poco menos que el contenedor */
      }

      @keyframes rotate {
        from {
          transform: rotate(0);
        }

        to {
          transform: rotate(360deg);
        }
      }

      input {
        background-color: rgb(41, 41, 41);
        border: none;
        border-radius: 10px;
        width: 90%;
        height: 25px;
        padding: 5px;
        margin: 15px;
        color: white;
        /* padding-left: 20px;
        padding-right: 20px; */

        text-align: center;
        font-weight: bold;
      }
      button {
        width: 80%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border-style: none;
        margin: auto;
        background: linear-gradient(
          90deg,
          #2a7b9b 0%,
          #57c785 50%,
          #eddd53 100%
        );
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 20px rgba(87, 199, 133, 0.3);
      }
      img {
        width: 100%;
        height: 250px;
        border-radius: 10px;
        /* visibility: hidden; */
        display: none;
      }
      .fecha {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h3>Bucles for</h3>
      <p id="mensaje"></p>
    </div>

    <script>
      let texto = "";
      for (let i = 1; i <= 10; i++) {
        texto += `El numero es: ${i} <br>`;
        if (i == 5){
           
            break
        }
        
      }
      document.getElementById("mensaje").innerHTML = texto;
    </script>
  </body>
</html>
