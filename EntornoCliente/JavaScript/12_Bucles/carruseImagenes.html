<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrousel de imagenes</title>
    <style>
      body {
        background-color: rgb(0, 4, 40);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .contenedor {
        padding: 50px;
        display: flex;
        flex-direction: column;
        width: 600px;
        min-height: 200px;
        background-color: rgb(0, 35, 67); /* Color de fondo interno */
        border-radius: 30px;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 10px rgb(65, 70, 84);
        position: relative;
        overflow: hidden; /* Corta el degradado sobrante */
        z-index: 0;
      }

      /* El borde animado */
      .contenedor::before {
        content: "";
        position: absolute;
        z-index: -2; /* Va detrás de todo */
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background-image: conic-gradient(
          red,
          yellow,
          green,
          red
        ); /* Añadimos rojo al final para un loop suave */
        animation: rotate 4s linear infinite;
      }

      /* La máscara para crear el efecto de "borde" */
      .contenedor::after {
        content: "";
        position: absolute;
        z-index: -1; /* Encima del degradado, pero debajo del texto */
        left: 4px; /* Grosor del borde */
        top: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        background-color: rgb(0, 35, 67); /* Mismo color que el fondo */
        border-radius: 26px; /* Un poco menos que el contenedor */
      }

      @keyframes rotate {
        from {
          transform: rotate(0);
        }

        to {
          transform: rotate(360deg);
        }
      }

      input {
        background-color: rgb(41, 41, 41);
        border: none;
        border-radius: 10px;
        width: 90%;
        height: 25px;
        padding: 5px;
        margin: 15px;
        color: white;
        /* padding-left: 20px;
        padding-right: 20px; */

        text-align: center;
        font-weight: bold;
      }
      button {
        width: 80%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border-style: none;
        margin: auto;
        background: linear-gradient(
          90deg,
          #2a7b9b 0%,
          #57c785 50%,
          #eddd53 100%
        );
        transition: all 0.3s ease;
      }
      button:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 20px rgba(87, 199, 133, 0.3);
      }
      img {
        width: 100%;
        height: 100px;
        border-radius: 5px;
        /* visibility: hidden; */
        /* display: none; */
      }
      .info-fotos {
        display: flex;
      }
      #numero-foto {
        position: absolute;
        left: 100px;
        top: 70px;
      }
      #info-foto {
        position: absolute;
        right: 100px;
        top: 70px;
      }

      .imagenes {
        width: 90%;
        max-height: 400px;
        background-color: #57c785;
        display: flex;
        border-radius: 10px;
      }
      .imagenes img {
        height: 300px;
      }
      .imagenes-peques {
        display: flex;
        /* width: 100%; */
      }
      .imgs {
        margin: 10px 20px;
        width: 100px;
        height: 100px;
        background-color: #57a0c7;
        border-radius: 7px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h3 {
        color: #2bc1fc;
        font-weight: bold;
      }
      .flechas img {
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #arrow-back {
        position: absolute;
        left: 40px;
        top: 250px;
      }
      .flechas:hover {
        background-color: black;
      }
      #arrow-foward {
        position: absolute;
        right: 40px;
        top: 250px;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h3>Carrusel</h3>
      <div class="info-fotos">
        <p id="numero-foto">0/4</p>
        <p id="info-foto">imagen-1</p>
      </div>

      <div class="imagenes">
        <img id="imagen-grande" src="/12_Bucles/img/1.jpg" alt="" />
      </div>
      <div class="imagenes-peques">
        <div onclick="mostrar(0)" class="imgs">
          <img src="/12_Bucles/img/1.jpg" alt="" />
        </div>
        <div onclick="mostrar(1)" class="imgs">
          <img src="/12_Bucles/img/2.jpg" alt="" />
        </div>
        <div onclick="mostrar(2)" class="imgs">
          <img src="/12_Bucles/img/3.jpg" alt="" />
        </div>
        <div onclick="mostrar(3)" class="imgs">
          <img src="/12_Bucles/img/4.jpg" alt="" />
        </div>
      </div>

      <div class="flechas">
        <img
          onclick="retroceder()"
          class="flechas"
          id="arrow-back"
          src="./img/arrow_back.png"
          alt=""
        />
        <img
          onclick="avanzar()"
          class="flechas"
          id="arrow-foward"
          src="./img/arrow_forward.png"
          alt=""
        />
      </div>
    </div>

    <script>
      let control = 0;
      function avanzar() {
        control++;
        let numero_foto = document.getElementById("numero-foto");
        let info_foto = document.getElementById("info-foto");
        let imagen_grande = document.getElementById("imagen-grande");
        let imagenes = ["imagen-1", "imagen-2", "imagen-3", "imagen-4"];
        let img_path = [
          "/12_Bucles/img/1.jpg",
          "/12_Bucles/img/2.jpg",
          "/12_Bucles/img/3.jpg",
          "/12_Bucles/img/4.jpg",
        ];

        if (control >3){
          control = 0;
        }
        numero_foto.innerHTML = `${control + 1}/${imagenes.length}`;
        imagen_grande.src = img_path[control];
        info_foto.innerHTML = imagenes[control];
        console.log(control);
        
        
      }
      function retroceder() {
        control--;
        let numero_foto = document.getElementById("numero-foto");
        let info_foto = document.getElementById("info-foto");
        let imagen_grande = document.getElementById("imagen-grande");
        let imagenes = ["imagen-1", "imagen-2", "imagen-3", "imagen-4"];
        let img_path = [
          "/12_Bucles/img/1.jpg",
          "/12_Bucles/img/2.jpg",
          "/12_Bucles/img/3.jpg",
          "/12_Bucles/img/4.jpg",
        ];

        if (control <0){
          control = 3;
        }
        numero_foto.innerHTML = `${control + 1}/${imagenes.length}`;
        imagen_grande.src = img_path[control];
        info_foto.innerHTML = imagenes[control];
        console.log(control);
        
        
      }

      function mostrar(valor) {
        let numero_foto = document.getElementById("numero-foto");
        let info_foto = document.getElementById("info-foto");
        let imagen_grande = document.getElementById("imagen-grande");
        let imagenes = ["imagen-1", "imagen-2", "imagen-3", "imagen-4"];
        let img_path = [
          "/12_Bucles/img/1.jpg",
          "/12_Bucles/img/2.jpg",
          "/12_Bucles/img/3.jpg",
          "/12_Bucles/img/4.jpg",
        ];

        // console.log(imagenes[valor]);
        numero_foto.innerHTML = `${valor + 1}/${imagenes.length}`;
        imagen_grande.src = img_path[valor];
        console.log(imagen_grande.src);

        info_foto.innerHTML = imagenes[valor];
      }
    </script>
  </body>
</html>
