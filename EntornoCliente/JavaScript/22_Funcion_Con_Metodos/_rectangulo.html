<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Geometria {
        constructor(nombre) {
          this.nombre = nombre;
        }
      }

      class rectangulo extends Geometria {
        constructor(lado1, lado2) {
          super("RECTANGULO");
          this.lado1 = lado1;

          this.lado2 = lado2;
        }
        area_rectangulo() {
          const resultado = this.lado1 * this.lado2;

          return `Soy un ${this.nombre} y mi area es ${resultado}`;
        }
      }
      class Triangulo extends Geometria {
        constructor(lado1, altura) {
          super("TRIANGULO");
          this.lado1 = lado1;
          this.altura = altura;
        }
        area_triangulo() {
          const resultado = (this.lado1 * this.altura) / 2;
          return `Soy un ${this.nombre} y mi area es ${resultado}`;
        }
      }
      class Circulo extends Geometria {
        constructor(radio) {
          super("CIRCULO");
          this.radio = radio;
        }
        area_circulo() {
          const resultado = Math.PI * Math.pow(this.radio, 2);
          return `Soy un ${this.nombre} y mi area es ${resultado.toFixed(2)}`;
        }
      }

      const triangulo1 = new Triangulo("triangulo", 4, 10);
      console.log(triangulo1.area_triangulo());

      const rectangulo1 = new rectangulo("rectangulo", 10, 10);
      console.log(rectangulo1.area_rectangulo());

      const circlulo1 = new Circulo("circulo", 5);
      console.log(circlulo1.area_circulo());
    </script>
  </body>
</html>
